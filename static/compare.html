<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgniLens · MODIS vs VIIRS</title><link rel="stylesheet" href="/shared.css"></head><body>
<div class="wrap"><h1>MODIS vs VIIRS comparison</h1><div class="card"><div class="row"><div><label>Start</label><input type="date" id="s"></div><div><label>End</label><input type="date" id="e"></div><button id="go">Compare</button></div></div><div id="out"></div></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script><script src="/shared.js"></script><script>
const ax={x:{ticks:{color:'#9AA9BC'}},y:{ticks:{color:'#9AA9BC'}}},lg={legend:{labels:{color:'#F4F7FB'}}};let c1,c2;
async function go(){const d=await api('/api/comparison?'+qs({start:$('s').value,end:$('e').value}));
 const lr=d.last_run;
 $('out').innerHTML='<div class="card"><h2>Daily detections by sensor</h2><canvas id="a" height="80"></canvas><p class="muted">Counts depend on pixel size (MODIS about 1 km, VIIRS 375 m), overpass times and the number of platforms, so they are not interchangeable. Only days with stored detections are plotted.</p></div>'+
 '<div class="card"><h2>FRP distribution (per sensor, MW)</h2><canvas id="b" height="80"></canvas><p class="muted">Shown separately. FRP from the two sensors is not directly comparable.</p></div>'+
 '<div class="card"><h2>Cross-sensor overlap (latest harmonization run)</h2>'+(lr?'<p>Run #'+lr.id+', '+lr.start+' to '+lr.end+', limits '+lr.params.max_dist_m+' m / '+lr.params.max_dt_min+' min.</p><div class="grid">'+[['Candidate pairs',lr.summary.candidate_pairs],['Groups',lr.summary.groups],['MODIS matched',lr.summary.modis_matched+' of '+lr.summary.modis_raw],['VIIRS matched',lr.summary.viirs_matched+' of '+lr.summary.viirs_raw],['Median distance (m)',lr.summary.median_distance_m??'–'],['Median time gap (min)',lr.summary.median_dt_min??'–']].map(x=>'<div class="stat"><b>'+x[1]+'</b><small>'+x[0]+'</small></div>').join('')+'</div>':'<p class="muted">No harmonization run yet. Use the <a href="/harmonize">Harmonization Studio</a>.</p>')+'</div>'+
 '<div class="card"><h2>What is directly comparable?</h2><table><tr><th>Quantity</th><th>Comparable?</th></tr><tr><td>Location and time of detection</td><td>Yes, within each sensor’s pixel size and timing</td></tr><tr><td>Raw detection counts</td><td>No: resolution and overpass differ</td></tr><tr><td>FRP</td><td>No: different pixel sizes and algorithms</td></tr><tr><td>Confidence</td><td>No: MODIS 0–100 versus VIIRS low/nominal/high</td></tr></table></div>';
 if(c1)c1.destroy();if(c2)c2.destroy();
 c1=new Chart($('a'),{type:'line',data:{labels:d.daily.map(x=>x.date),datasets:[{label:'MODIS',data:d.daily.map(x=>x.MODIS),borderColor:'#36BFFA',pointRadius:1},{label:'VIIRS',data:d.daily.map(x=>x.VIIRS),borderColor:'#FFB547',pointRadius:1}]},options:{plugins:lg,scales:ax}});
 const lab=d.frp_bins.map((e,i)=>i===d.frp_bins.length-1?e+'+':e+'–'+d.frp_bins[i+1]);
 c2=new Chart($('b'),{type:'bar',data:{labels:lab,datasets:[{label:'MODIS',data:d.frp_hist.MODIS,backgroundColor:'#36BFFA'},{label:'VIIRS',data:d.frp_hist.VIIRS,backgroundColor:'#FFB547'}]},options:{plugins:lg,scales:ax}})}
shell().then(async()=>{const ov=await api('/api/overview?'+qs());if(!ov.total){$('out').innerHTML=EMPTY;return}
 const f=ov.by_source.map(r=>r.first).sort()[0],l=ov.by_source.map(r=>r.last).sort().pop();$('s').value=f;$('e').value=l;$('go').onclick=go;go()});
</script></body></html>
