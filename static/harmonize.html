<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgniLens · Harmonization Studio</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="/shared.css"></head><body>
<div class="wrap"><h1>Harmonization Studio</h1>
<p class="muted">MODIS and VIIRS detections from <b>all stored platforms</b> are matched as <i>candidate correspondences</i> in space and time. A match means “close in space and time”, not “proven to be the same fire”.</p>
<div class="card"><div class="row"><div><label for="s">Start</label><input type="date" id="s"></div><div><label for="e">End</label><input type="date" id="e"></div><div><label for="dist">Max distance (m)</label><input type="number" id="dist" value="1000" min="100" max="5000" style="width:110px"></div>
<div><label for="dt">Max time gap (min)</label><input type="number" id="dt" value="120" min="0" max="720" style="width:110px"></div><button id="run">Run harmonization</button></div><div id="msg" class="muted" role="status" aria-live="polite" style="margin-top:8px"></div></div>
<div id="res"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/shared.js"></script><script>
let map,layer;const f1=v=>v==null?'–':v;
async function run(){return withBusy($('run'),async()=>{$('msg').textContent='Running harmonization…';
 try{const d=await api('/api/harmonize?'+qs({start:$('s').value,end:$('e').value,dist:$('dist').value,dt:$('dt').value}),{method:'POST'});$('msg').textContent='Run #'+d.run_id+' saved. '+(d.truncated?'Map shows the first part of a large result.':'');show(d)}
 catch(e){$('msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'}})}
function show(d){const s=d.summary,it=[['MODIS detections',s.modis_raw],['VIIRS detections',s.viirs_raw],['Candidate pairs',s.candidate_pairs],['Correspondence groups',s.groups],['MODIS only',s.modis_only],['VIIRS only',s.viirs_only],['Many-to-one groups',s.many_to_one_groups],['Median distance (m)',f1(s.median_distance_m)],['Median time gap (min)',f1(s.median_dt_min)]];
 $('res').innerHTML='<div class="card"><div class="grid">'+it.map(i=>'<div class="stat"><b>'+i[1]+'</b><small>'+i[0]+'</small></div>').join('')+'</div></div><div class="card"><h2>Map</h2><div class="muted"><span style="color:#36BFFA">●</span> MODIS only &nbsp;<span style="color:#FFB547">●</span> VIIRS only &nbsp;<span style="color:#22D3A6">●</span> in a candidate group (line joins matched pairs)</div><div id="map" style="height:480px;margin-top:8px"></div></div>'+
 '<div class="card"><h2>Daily counts by sensor</h2><div style="overflow-x:auto"><table><tr><th>Date</th><th>MODIS</th><th>VIIRS</th><th>MODIS FRP mean</th><th>VIIRS FRP mean</th></tr>'+d.daily.map(r=>'<tr><td>'+r.date+'</td><td>'+r.modis.count+'</td><td>'+r.viirs.count+'</td><td>'+f1(r.modis.frp_mean)+'</td><td>'+f1(r.viirs.frp_mean)+'</td></tr>').join('')+'</table></div><p class="muted">Counts are detections, not fires. FRP differs by sensor (MODIS about 1 km pixels, VIIRS 375 m) and is never merged. Confidence is MODIS 0–100 versus VIIRS low/nominal/high, so it is shown raw per sensor.</p></div>'+
 '<div class="card"><h2>Method and limitations</h2><ul class="muted"><li>Candidates are pairs within your distance and time limits (haversine distance, UTC time). Pairs are joined into groups; one point can match several on the other sensor.</li><li>Nothing is dropped or forced into one-to-one matches.</li><li>Default limits (1 km, 120 min) are adjustable starting values, not validated results.</li><li>See docs/METHODOLOGY.md.</li></ul></div>';
 if(typeof L==='undefined'){$('map').textContent='Leaflet map library is unavailable. Summary and table results are still shown.';return}
 map=L.map('map',{preferCanvas:true,scrollWheelZoom:false}).setView([30.4,75.6],7);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:12}).addTo(map);
 const g=L.layerGroup().addTo(map),pts=[];d.pairs.forEach(p=>L.polyline([p.m,p.v],{color:'#22D3A6',weight:1.5,opacity:.8}).addTo(g));
 d.observations.forEach(o=>{const c=o.group_id?'#22D3A6':o.sensor==='MODIS'?'#36BFFA':'#FFB547';L.circleMarker([o.lat,o.lon],{radius:o.sensor==='MODIS'?5:3,color:c,weight:1,fillColor:c,fillOpacity:.6}).addTo(g).bindPopup('<b>'+o.sensor+'</b> ('+esc(o.satellite)+')<br>'+o.ts.replace('T',' ').slice(0,16)+' UTC<br>FRP: '+f1(o.frp)+' MW<br>Confidence (raw): '+esc(o.confidence_raw)+'<br>Group: '+(o.group_id||'none'));pts.push([o.lat,o.lon])});
 if(pts.length)map.fitBounds(pts,{maxZoom:9,padding:[20,20]})}
shell().then(async()=>{const ov=await api('/api/overview?'+qs());if(!ov.total){$('res').innerHTML=EMPTY;$('run').disabled=true;return}
 const last=ov.by_source.map(r=>r.last).sort().pop(),d=new Date(last+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-3);$('e').value=last;$('s').value=d.toISOString().slice(0,10);$('run').onclick=run;run()});
</script></body></html>
