<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgniLens · Anomalies</title><link rel="stylesheet" href="/shared.css"></head><body>
<div class="wrap"><h1>Historical anomaly analysis</h1><p class="muted">Observed detections are compared with the same calendar month (or day ±7) in other years, using only periods with enough data. A robust median/MAD score (flag at |z| ≥ 3.5) is used. This describes unusual observed satellite activity. It is not a wildfire prediction.</p>
<div class="card"><div class="row"><div><label for="sen">Sensor</label><select id="sen"><option>VIIRS</option><option>MODIS</option></select></div><div><label for="lvl">Level</label><select id="lvl"><option value="monthly">Monthly</option><option value="daily">Daily</option></select></div><div><label for="my">Min comparable years</label><input id="my" type="number" min="2" max="20" value="3" style="width:90px"></div><button id="go">Analyse</button></div></div><div id="out"></div></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script><script src="/shared.js"></script><script>
let ch;async function go(){const a=await api('/api/anomalies?'+qs({sensor:$('sen').value,level:$('lvl').value,min_years:$('my').value}));
 if(a.status!=='ok'){$('out').innerHTML='<div class="card"><b>Cannot be calculated reliably.</b><p class="muted">'+esc(a.message)+'</p><ul class="muted">'+a.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul></div>';return}
 const rows=a.anomalies.map(x=>'<tr><td>'+(x.month||x.date)+'</td><td>'+esc(a.region)+'</td><td>'+x.observed+'</td><td>'+x.baseline.median+' (n='+x.baseline.n+')</td><td>'+(x.baseline.robust_z??x.baseline.z)+'</td><td>'+a.sensor+', '+x.baseline_years+' baseline years</td><td>'+esc(x.explanation)+(x.caveat?'<br><span style="color:var(--warn)">'+esc(x.caveat)+'</span>':'')+(x.constellation?'<br><span class="muted">Platforms: '+esc(x.constellation.observed.join(', ')||'none')+' (baseline usually: '+esc(x.constellation.baseline_common.join(', ')||'none')+'; similarity '+x.constellation.jaccard_vs_common+')</span>':'')+'</td></tr>').join('');
 const nt='<div class="card muted"><ul>'+a.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>'+((a.excluded_assumed_months||a.excluded_partial_months)?'<p style="color:var(--warn)">Excluded: '+a.excluded_assumed_months+' month(s) with assumed-only coverage and '+a.excluded_partial_months+' month(s) with under 80% confirmed coverage.</p>':'')+'</div>';
 $('out').innerHTML=nt+(a.level==='monthly'?'<div class="card"><canvas id="c" height="80"></canvas></div>':'')+'<div class="card"><h2>Flagged periods ('+a.anomalies.length+' of '+a.evaluated+' evaluated; '+a.insufficient+' lacked a baseline)</h2><div style="overflow-x:auto"><table><tr><th>Period</th><th>Region</th><th>Observed</th><th>Baseline median</th><th>Score</th><th>Sensor coverage</th><th>Explanation</th></tr>'+(rows||'<tr><td colspan="7" class="muted">No unusual periods flagged.</td></tr>')+'</table></div></div>';
 if(a.level==='monthly'){if(typeof Chart==='undefined'){$('out').insertAdjacentHTML('afterbegin','<p class="card err" role="status">Chart.js could not load. The table still shows flagged periods.</p>');return}if(ch)ch.destroy();const it=a.items;ch=new Chart($('c'),{type:'line',data:{labels:it.map(x=>x.month),datasets:[{label:'Observed',data:it.map(x=>x.observed),borderColor:'#FFB547',pointBackgroundColor:it.map(x=>x.flagged?'#FF5B5B':'#FFB547'),pointRadius:it.map(x=>x.flagged?6:2)},{label:'Baseline median',data:it.map(x=>x.baseline?x.baseline.median:null),borderColor:'#36BFFA',borderDash:[5,4],pointRadius:0}]},options:{plugins:{legend:{labels:{color:'#F4F7FB'}}},scales:{x:{ticks:{color:'#9AA9BC',maxTicksLimit:14}},y:{ticks:{color:'#9AA9BC'}}}}})}}
async function run(){return withBusy($('go'),async()=>{try{await go()}catch(e){$('out').innerHTML='<p class="err">'+esc(e.message)+'</p>'}})}
shell().then(()=>{$('go').onclick=run;run()}).catch(e=>$('out').innerHTML='<p class="err">'+esc(e.message)+'</p>');
</script></body></html>
